include: package:rexios_lints/flutter/package_extra.yaml

analyzer:
  errors:
    # rexios_lints 9.x still enables the legacy analyzer plugin API.
    included_file_warning: ignore
    # Flutter 3.50 deprecates package:flutter/material.dart. This package still
    # supports older Flutter SDKs, so package:material_ui is not a compatible
    # dependency yet.
    deprecated_member_use: ignore
